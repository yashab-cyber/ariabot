version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aria_postgres
    restart: always
    environment:
      POSTGRES_USER: aria
      POSTGRES_PASSWORD: ariapassword
      POSTGRES_DB: ariabot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aria_redis
    restart: always
    ports:
      - "6379:6379"

  bot:
    build: .
    container_name: aria_bot
    restart: always
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://aria:ariapassword@postgres:5432/ariabot
      - REDIS_URL=redis://redis:6379/0

  dashboard:
    build: .
    container_name: aria_dashboard
    restart: always
    command: uvicorn dashboard.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

volumes:
  postgres_data:
